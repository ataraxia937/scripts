ipc_socket = false

[window]
dimensions.columns = 80
dimensions.lines = 24
startup_mode = "Maximized"
resize_increments = true

[scrolling]
history = 10000

[font]
normal.family = "Cousine"
size = 12

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.mods = "Control"
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"

[colors.primary]
background = '#f8f8f8'
foreground = '#2a2b32'

[colors.normal]
black   = '#000000'
red     = '#da3e39'
green   = '#41933e'
yellow  = '#855504'
blue    = '#315eee'
magenta = '#930092'
cyan    = '#0e6fad'
white   = '#8e8f96'

[colors.bright]
black   = '#2a2b32'
red     = '#da3e39'
green   = '#41933e'
yellow  = '#855504'
blue    = '#315eee'
magenta = '#930092'
cyan    = '#0e6fad'
white   = '#fffefe'
