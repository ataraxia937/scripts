
name: Backup to S3

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone
        timeout-minutes: 2
        run: |-
          gh repo clone ${{ github.repository }} -- --bare
          pwd
          ls -la

      - name: Archive repository
        timeout-minutes: 2
        run: |-
          ls -la "$HOME"
          zip -r "$HOME/${{ github.event.repository.name }}-$(date +%Y%m%dT%H%M%S).zip" ${{ github.event.repository.name }}

      - name: Upload archive to S3
        timeout-minutes: 2
        run: |-
          export AWS_ACCESS_KEY_ID="${{ secrets.ACCESS_KEY }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.SECRET_KEY }}"
          export AWS_REGION="${{ secrets.REGION }}"
          export AWS_DEFAULT_REGION="$AWS_REGION"
          aws s3 cp $HOME/${{ github.event.repository.name }}-*.zip s3://${{ secrets.BUCKET }}/${{ github.event.repository.name }}/
